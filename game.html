<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake — built by an AI agent from one prompt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0b12; color: #f2f2f7;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px;
  }
  h1 { font-size: 28px; letter-spacing: 2px; }
  h1 span { color: #39ff88; }
  #hud {
    display: flex; gap: 24px; font-size: 18px; font-weight: 700;
  }
  #hud b { color: #ff2e88; }
  canvas {
    background: #101018; border: 2px solid #39ff88; border-radius: 12px;
    box-shadow: 0 0 32px rgba(57, 255, 136, .25); touch-action: none;
    max-width: 92vw; max-height: 62vh;
  }
  #msg { font-size: 16px; color: #b9b9c9; min-height: 22px; text-align: center; }
  #msg b { color: #39ff88; }
  p.foot { font-size: 13px; color: #77778a; text-align: center; max-width: 420px; }
  p.foot a { color: #ff2e88; }
</style>
</head>
<body>
  <h1>NEON <span>SNAKE</span></h1>
  <div id="hud">SCORE <b id="score">0</b> <span>BEST <b id="best">0</b></span></div>
  <canvas id="game" width="360" height="360"></canvas>
  <div id="msg">Arrow keys or WASD to steer — eat the dots, don't crash.</div>
  <p class="foot">Built by an AI agent from one prompt for a make.fun bounty.
  One file, no libraries. <a href="https://make.fun">make.fun</a></p>
<script>
  // Neon Snake: one prompt, one file, one game.
  // Rules: the snake moves one cell per tick, eats dots to grow and score,
  // speeds up a little every dot, and the run ends on a wall or on itself.
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');

  const CELLS = 18;                 // playfield is 18 x 18 cells
  const CELL = canvas.width / CELLS;
  const START_SPEED = 150;          // ms per tick at the start
  const MIN_SPEED = 70;             // fastest tick once the snake is long

  let snake, dir, queued, food, score, best, timer, alive;

  function reset() {
    snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
    dir = { x: 1, y: 0 };
    queued = [];
    score = 0;
    alive = true;
    scoreEl.textContent = '0';
    msgEl.innerHTML = 'Arrow keys or WASD to steer — eat the dots, don\'t crash.';
    placeFood();
    clearTimeout(timer);
    timer = setTimeout(tick, START_SPEED);
  }

  function placeFood() {
    // Pick a free cell at random; never on the snake.
    while (true) {
      const spot = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS),
      };
      if (!snake.some(s => s.x === spot.x && s.y === spot.y)) {
        food = spot;
        return;
      }
    }
  }

  function speed() {
    // A little faster with every dot, down to the floor.
    return Math.max(MIN_SPEED, START_SPEED - score * 4);
  }

  function tick() {
    if (!alive) return;
    if (queued.length) {
      const next = queued.shift();
      // Never reverse straight into the neck.
      if (next.x !== -dir.x || next.y !== -dir.y) dir = next;
    }
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = String(score);
      best = Math.max(best, score);
      bestEl.textContent = String(best);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(tick, speed());
  }

  function gameOver() {
    alive = false;
    best = Math.max(best, score);
    bestEl.textContent = String(best);
    msgEl.innerHTML = `Game over — <b>${score} points</b>. Press Space or tap to play again.`;
  }

  function draw() {
    ctx.fillStyle = '#101018';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Faint grid, so the cells read on video.
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }
    // Food: a hot-pink dot.
    ctx.fillStyle = '#ff2e88';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
    ctx.fill();
    // Snake: neon green, head brightest.
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#a8ffcb' : '#39ff88';
      const pad = i === 0 ? 1 : 2;
      ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    });
  }

  function steer(x, y) {
    if (queued.length < 3) queued.push({ x, y });
  }

  const KEYS = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0],
  };

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { if (!alive) reset(); e.preventDefault(); return; }
    const move = KEYS[e.code];
    if (move) { steer(move[0], move[1]); e.preventDefault(); }
  });

  // Swipe to steer on touch screens.
  let touch = null;
  canvas.addEventListener('touchstart', (e) => {
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (!alive) reset();
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch.x;
    const dy = e.changedTouches[0].clientY - touch.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      steer(Math.abs(dx) > Math.abs(dy) ? Math.sign(dx) : 0,
            Math.abs(dx) > Math.abs(dy) ? 0 : Math.sign(dy));
    }
    touch = null;
  });

  canvas.addEventListener('click', () => { if (!alive) reset(); });

  best = 0;
  reset();
  draw();
</script>
</body>
</html>
